server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/rural_tutoring?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd
    time-format: HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis:
  mapper-locations: classpath:mybatis/mapper/*.xml  # XML 文件路径
  type-aliases-package: com.example.rural_tutoring.entity  # 实体类包路径
  configuration:
    map-underscore-to-camel-case: true      # 开启驼峰命名自动映射
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl  # 日志实现
  type-handlers-package: org.apache.ibatis.type.LocalTimeTypeHandler # 添加LocalTime类型处理器

# 文件上传配置
file:
  upload:
    path: /Users/jiashuhang/JavaProject/Rural_tutoring/uploads  # 文件上传路径
  access:
    url: /Users/jiashuhang/JavaProject/Rural_tutoring/uploads  # 文件访问URL前缀

# Swagger配置 (SpringDoc OpenAPI)
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs